name: SMF E2E

on:
  workflow_dispatch:

concurrency:
  group: smf-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  non-apple-workflow:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: 3.10.0

      - name: Install the public Dart package
        run: dart pub get --enforce-lockfile

      - name: Exercise the CLI and reusable Dart API
        run: |
          dart run smf_cli:smf validate
          dart run smf_cli:smf release --phase pull-request --help
          dart run smf_cli:smf release --phase release-candidate --platform ios --help
          dart run example/custom_workflow.dart

      - id: project
        uses: Ventairy/smf-action/resolve-project@56c58eef3b94303697ac9474c8fccabb67ac588b
        with:
          smf-path: smf

      - if: steps.project.outputs.has-before-create-hook == 'true'
        uses: Ventairy/smf-action/setup-flutter@56c58eef3b94303697ac9474c8fccabb67ac588b
        with:
          app-path: ${{ steps.project.outputs.app-path }}
          uses-fvm: ${{ steps.project.outputs.uses-fvm }}
          fvm-root: ${{ steps.project.outputs.fvm-root }}

      - name: Verify toolchain setup kept the fixture clean
        run: |
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            git status --porcelain=v1 --untracked-files=all
            exit 1
          fi

      - id: ship
        name: Exercise the thin GitHub Action adapter
        uses: Ventairy/smf-action@56c58eef3b94303697ac9474c8fccabb67ac588b
        with:
          phase: pull-request
          platform: ios
          smf-path: smf

      - name: Record the decision without invoking Apple
        env:
          PHASE: ${{ steps.ship.outputs.phase }}
          BRANCH: ${{ steps.ship.outputs.branch }}
          VERSION: ${{ steps.ship.outputs.version }}
          RELEASES: ${{ steps.ship.outputs.releases }}
        run: |
          printf 'phase=%s\nbranch=%s\nversion=%s\nreleases=%s\n' "$PHASE" "$BRANCH" "$VERSION" "$RELEASES"
          if [[ "$PHASE" != "release-candidate" || "$RELEASES" != *'"platform":"ios"'* || "$RELEASES" == *'"platform":"android"'* ]]; then
            printf 'Unexpected platform-filtered result.\n' >&2
            exit 1
          fi
          {
            printf '## SMF decision\n\n'
            printf -- '- phase: `%s`\n' "$PHASE"
            printf -- '- branch: `%s`\n' "$BRANCH"
            printf -- '- version: `%s`\n' "$VERSION"
            printf -- '- releases: `%s`\n' "$RELEASES"
          } >> "$GITHUB_STEP_SUMMARY"

      # This fixture intentionally has no release-candidate or ship job. Those
      # phases touch App Store Connect and are outside this repository's scope.
