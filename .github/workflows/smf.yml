name: SMF E2E

on:
  workflow_dispatch:

concurrency:
  group: smf-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  non-apple-workflow:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: 3.10.0

      - name: Install the exact SMF commit
        run: dart pub get --enforce-lockfile

      - name: Exercise the CLI and reusable Dart API
        run: |
          dart analyze --fatal-infos
          dart run smf_cli:smf --version
          dart run smf_cli:smf validate
          dart run smf_cli:smf release --phase pull-request --help
          dart run smf_cli:smf release --phase release-candidate --platform ios --help
          dart run smf_cli:smf release --phase ship --platform android --help
          dart run example/custom_workflow.dart

      - id: project
        uses: Ventairy/smf-action/resolve-project@bf363393ca40828693d17f2f1cc1fd4073b6c601
        with:
          smf-path: smf

      - if: steps.project.outputs.has-before-create-hook == 'true'
        uses: Ventairy/smf-action/setup-flutter@bf363393ca40828693d17f2f1cc1fd4073b6c601
        with:
          app-path: ${{ steps.project.outputs.app-path }}
          uses-fvm: ${{ steps.project.outputs.uses-fvm }}
          fvm-root: ${{ steps.project.outputs.fvm-root }}

      - name: Exercise phase-scoped hook secrets
        env:
          E2E_HOOK_SECRET: ${{ secrets.E2E_HOOK_SECRET }}
        run: dart run example/hook_secret_e2e.dart

      - name: Verify toolchain setup kept the fixture clean
        run: |
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            git status --porcelain=v1 --untracked-files=all
            exit 1
          fi

      - id: plan
        name: Exercise the thin GitHub Action adapter
        uses: Ventairy/smf-action@bf363393ca40828693d17f2f1cc1fd4073b6c601
        with:
          phase: pull-request
          platform: ios
          smf-path: smf

      - name: Record the decision without invoking Apple
        env:
          NEXT_PHASE: ${{ steps.plan.outputs.next-phase }}
          RELEASE_BRANCH: ${{ steps.plan.outputs.release-branch }}
          VERSION: ${{ steps.plan.outputs.version }}
          TARGETS: ${{ steps.plan.outputs.targets }}
          CANDIDATES: ${{ steps.plan.outputs.candidates }}
          RELEASES: ${{ steps.plan.outputs.releases }}
        run: |
          printf 'next-phase=%s\nrelease-branch=%s\nversion=%s\ntargets=%s\n' "$NEXT_PHASE" "$RELEASE_BRANCH" "$VERSION" "$TARGETS"
          if [[ "$NEXT_PHASE" != "release-candidate" ||
                "$RELEASE_BRANCH" != "smf/phased-cli-e2e/release" ||
                "$TARGETS" != *'"platform":"ios"'* ||
                "$TARGETS" == *'"platform":"android"'* ||
                -n "$CANDIDATES" ||
                -n "$RELEASES" ]]; then
            printf 'Unexpected platform-filtered result.\n' >&2
            exit 1
          fi
          {
            printf '## SMF decision\n\n'
            printf -- '- next phase: `%s`\n' "$NEXT_PHASE"
            printf -- '- release branch: `%s`\n' "$RELEASE_BRANCH"
            printf -- '- version: `%s`\n' "$VERSION"
            printf -- '- targets: `%s`\n' "$TARGETS"
          } >> "$GITHUB_STEP_SUMMARY"

      # This fixture intentionally has no release-candidate or ship job. Those
      # phases touch App Store Connect and are outside this repository's scope.
