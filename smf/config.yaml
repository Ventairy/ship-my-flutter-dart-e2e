# yaml-language-server: $schema=https://raw.githubusercontent.com/Ventairy/smf/2abbe6789dda462fd66a8269c1ed9c3690f72a3d/packages/smf_engine/schemas/config.schema.json

schema_version: 1
app_id: phased-cli-e2e
target_branch: agent/phased-cli-e2e
hooks:
  before_create_pr:
    secrets:
      - E2E_HOOK_SECRET
platforms:
  ios:
    enabled: true
    initial_version: 1.1.1
    bundle_id: dev.ventairy.smf_e2e
    app_store:
      release_candidate:
        target: internal-testing
  android:
    enabled: true
    initial_version: 1.0.0
    package_name: dev.ventairy.smf_e2e
    google_play:
      release_candidate:
        target: internal-testing
