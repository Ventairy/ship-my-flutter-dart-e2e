hooks: {}
platforms:
  ios:
    enabled: true
    projectPath: .
    bundleId: "com.example.shipmyfluttere2e"
    buildArgs: []
    testflight:
      groups: []
      waitTimeoutMinutes: 45
    appStore:
      mode: upload-only
      releaseType: manual
